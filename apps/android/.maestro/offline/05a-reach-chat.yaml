appId: com.dhama.mybase
name: Offline setup
tags:
  - offline-part
---
# Run only from run-offline.sh, while the network is still up.
# Leaves the app on the chat composer without sending.
- runFlow:
    file: ../subflows/reach-home.yaml
- runFlow:
    file: ../subflows/open-chat.yaml
- assertVisible:
    id: chat_send
