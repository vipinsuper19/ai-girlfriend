appId: com.dhama.mybase
tags:
  - helper
---
# Voice is off in app/build.gradle.kts (featureVoice = false), so the wizard is 3 steps.
- assertVisible:
    id: wizard_intro
- tapOn:
    id: wizard_start
- extendedWaitUntil:
    visible: "How should she look[?]"
    timeout: 15000
- assertVisible:
    id: wizard_step
    text: "Step 1 of 3"
- tapOn: "Illustrated"
- takeScreenshot: ${SHOT}-wizard-look
- tapOn:
    id: wizard_continue
- extendedWaitUntil:
    visible: "Who is she[?]"
    timeout: 15000
- assertVisible:
    id: wizard_step
    text: "Step 2 of 3"
- scrollUntilVisible:
    element:
      text: "Witty"
    direction: DOWN
    timeout: 15000
- tapOn: "Witty"
- takeScreenshot: ${SHOT}-wizard-personality
- tapOn:
    id: wizard_continue
- extendedWaitUntil:
    visible:
      id: wizard_name
    timeout: 15000
- assertVisible:
    id: wizard_step
    text: "Step 3 of 3"
- tapOn:
    id: wizard_name
- eraseText: 30
- inputText: ${output.companion}
- hideKeyboard
- takeScreenshot: ${SHOT}-wizard-name
- tapOn:
    id: wizard_create
- extendedWaitUntil:
    visible:
      id: home_talk
    timeout: 120000
- assertVisible: ${output.companion}
- assertVisible: "Say hello"
- takeScreenshot: ${SHOT}-home
