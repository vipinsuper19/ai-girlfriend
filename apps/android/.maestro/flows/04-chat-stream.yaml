appId: com.dhama.mybase
name: Chat stream
tags:
  - chat
---
# Sends one line and waits until a non-empty assistant bubble exists.
# chat_assistant_reply does not include the greeting or a failed send, and the flow does not read the reply.
- runFlow:
    file: ../subflows/reach-home.yaml
- runFlow:
    file: ../subflows/open-chat.yaml
- runFlow:
    file: ../subflows/send-and-wait-reply.yaml
