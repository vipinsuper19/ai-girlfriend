appId: com.dhama.mybase
name: Report assistant message
tags:
  - chat
env:
  SHOT: 07-report-message
---
- runFlow:
    file: ../subflows/reach-home.yaml
- runFlow:
    file: ../subflows/open-chat.yaml
- runFlow:
    file: ../subflows/send-and-wait-reply.yaml
# Wait for the stream to finish so the bubble has its server id before reporting.
- extendedWaitUntil:
    notVisible: "Typing…"
    timeout: 180000
- longPressOn:
    id: chat_assistant_reply
- extendedWaitUntil:
    visible:
      id: chat_report
    timeout: 10000
- takeScreenshot: ${SHOT}-report-menu
- tapOn:
    id: chat_report
- extendedWaitUntil:
    visible: "What should we look at?"
    timeout: 10000
- tapOn:
    id: report_reason_INACCURATE
- tapOn:
    id: report_send
- extendedWaitUntil:
    visible:
      id: report_thanks
      text: "Thanks. We'll review this reply."
    timeout: 60000
- takeScreenshot: ${SHOT}-report-thanks
