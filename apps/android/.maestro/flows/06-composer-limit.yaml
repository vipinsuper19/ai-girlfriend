appId: com.dhama.mybase
name: Composer 7000 character cap
tags:
  - chat
env:
  SHOT: 06-composer-limit
---
# Run only from run-composer-cap.sh, after the 7100-character draft is applied.
# Does not clear app state. The chat from 06a must still be open.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: chat_composer
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: chat_draft_limit
      text: "[0-9]+ / 7000.*"
    timeout: 20000
- takeScreenshot: ${SHOT}-cap
