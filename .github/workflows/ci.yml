name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ai-girlfriend/api...
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm exec prisma migration check
      - name: Apply migrations on a clean database
        run: pnpm exec prisma db migrate --no-interactive
      - run: pnpm run test

  android:
    name: Android (unit tests, bundleRelease)
    runs-on: ubuntu-latest
    # upload-artifact writes to the Actions artifact store, not the repo.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No KEYSTORE_BASE64 secret, so the release build will be unsigned."
          fi
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest
      - name: assembleDebug without google-services.json
        run: |
          backup=""
          if [ -f app/google-services.json ]; then
            backup="$(mktemp)"
            mv app/google-services.json "$backup"
          fi
          status=0
          ./gradlew assembleDebug || status=$?
          if [ -n "$backup" ]; then
            mv "$backup" app/google-services.json
          fi
          exit "$status"
      - name: bundleRelease
        env:
          API_BASE_URL_RELEASE: ${{ vars.API_BASE_URL_RELEASE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$API_BASE_URL_RELEASE" ]; then
            echo "::notice::Repo variable API_BASE_URL_RELEASE is unset; building with -PallowPlaceholderApi=true -PdisableMappingUpload=true."
            ./gradlew bundleRelease -PallowPlaceholderApi=true -PdisableMappingUpload=true
          else
            ./gradlew bundleRelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: error
