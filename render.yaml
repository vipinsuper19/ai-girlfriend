# Render Blueprint: API on the free plan. Secrets use sync: false, so Render
# asks for their values when the Blueprint is first applied. Nothing is in git.
# autoDeploy is false: ship with a manual deploy after the image is reviewed.
services:
  - type: web
    name: ai-girlfriend-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase transaction pooler, port 6543, with ?pgbouncer=true.
      # The app reads this in src/prisma/db.ts. Render injects PORT itself.
      - key: DATABASE_URL
        sync: false
      # Supabase session/direct connection, port 5432. Prisma CLI migrations
      # read this from prisma.config.ts and fall back to DATABASE_URL.
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        sync: false
      - key: JWT_RESET_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        sync: false
      - key: GEMINI_IMAGE_MODEL
        sync: false
      - key: GEMINI_STT_MODEL
        sync: false
      - key: GEMINI_TTS_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_PRODUCTS
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
