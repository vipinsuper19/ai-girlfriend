# Render Blueprint: API on the free plan. Secrets use sync: false, so Render
# asks for their values when the Blueprint is first applied. Nothing is in git.
# autoDeploy is false: ship with a manual deploy after the image is reviewed.
services:
  - type: web
    name: ai-girlfriend-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase session pooler, port 5432 (*.pooler.supabase.com).
      # Do not use the transaction pooler on port 6543: the runtime sends
      # named prepared statements and cannot turn them off. The app reads
      # this in src/prisma/db.ts. Render injects PORT itself.
      - key: DATABASE_URL
        sync: false
      # Required. The container runs prisma db migrate against this URL
      # before the API listens, and exits if it is empty. Session pooler
      # port 5432. Enable the vector extension in Supabase first.
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        sync: false
      - key: JWT_RESET_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        sync: false
      - key: GEMINI_IMAGE_MODEL
        sync: false
      - key: GEMINI_STT_MODEL
        sync: false
      - key: GEMINI_TTS_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Optional. Leave the Render prompt empty to keep Play billing off.
      # The API treats a missing or blank value as unconfigured (503).
      # Render still prompts because sync: false has no optional flag.
      # Do not set value: "" — a later Blueprint sync can wipe a real key.
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_PRODUCTS
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Private Supabase Storage bucket, reached through its S3 endpoint.
      # Copy endpoint, region, and keys from Storage → S3. The bucket must
      # not be public. forcePathStyle stays on for Supabase, MinIO, and B2;
      # set it to false only for AWS S3.
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_SIGNED_URL_TTL_SECONDS
        value: "3600"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
