# Render Blueprint: API on the free plan, as a native Node service.
# Render does not run apps/api/Dockerfile. The service root is the repo root.
#
# Secret values are not in this file. Each one is `sync: false` on the
# service, so Render asks for it in the dashboard secret manager the first
# time the Blueprint is applied and keeps the dashboard value after that.
# `sync: false` inside an env group is ignored by Render and would boot the
# service with the variable empty, so secrets stay on the service.
#
# Non-secret defaults live in the env group. Code defaults match them when
# the variable is unset.
#
# autoDeploy is false: ship with a manual deploy after the build is reviewed.
envVarGroups:
  - name: ai-girlfriend-api-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: STORAGE_SIGNED_URL_TTL_SECONDS
        value: "3600"
      - key: MODERATION_ENABLED
        value: "true"
      # Off until clients call PATCH /users/me/age. true returns 403 AGE_REQUIRED.
      - key: AGE_GATE_ENFORCED
        value: "false"
      - key: MODERATION_FAIL_CLOSED
        value: "true"
      - key: MODERATION_PROVIDER
        value: auto
      - key: FREE_TIER_LLM_PERIOD
        value: day
      - key: FREE_TIER_LLM_MESSAGE_LIMIT
        value: "40"
      - key: FREE_TIER_LLM_TOKEN_LIMIT
        value: "50000"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: RATE_LIMIT_LOGIN_IP_MAX
        value: "20"
      - key: RATE_LIMIT_LOGIN_IP_WINDOW_SEC
        value: "900"
      - key: RATE_LIMIT_LOGIN_USER_MAX
        value: "10"
      - key: RATE_LIMIT_LOGIN_USER_WINDOW_SEC
        value: "900"
      - key: RATE_LIMIT_REGISTER_IP_MAX
        value: "10"
      - key: RATE_LIMIT_REGISTER_IP_WINDOW_SEC
        value: "3600"
      - key: RATE_LIMIT_REGISTER_USER_MAX
        value: "5"
      - key: RATE_LIMIT_REGISTER_USER_WINDOW_SEC
        value: "3600"
      - key: RATE_LIMIT_PASSWORD_RESET_IP_MAX
        value: "10"
      - key: RATE_LIMIT_PASSWORD_RESET_IP_WINDOW_SEC
        value: "3600"
      - key: RATE_LIMIT_PASSWORD_RESET_USER_MAX
        value: "5"
      - key: RATE_LIMIT_PASSWORD_RESET_USER_WINDOW_SEC
        value: "3600"
      - key: RATE_LIMIT_MESSAGES_IP_MAX
        value: "60"
      - key: RATE_LIMIT_MESSAGES_IP_WINDOW_SEC
        value: "60"
      - key: RATE_LIMIT_MESSAGES_USER_MAX
        value: "30"
      - key: RATE_LIMIT_MESSAGES_USER_WINDOW_SEC
        value: "60"
      - key: TRUST_PROXY_HOPS
        value: "1"

services:
  - type: web
    name: ai-girlfriend-api
    runtime: node
    plan: free
    # One instance. Reply generation takes an in-process lock per conversation,
    # so a second instance can generate two replies for the same line.
    region: singapore
    branch: main
    # NODE_ENV=production would omit the TypeScript toolchain. Install it, then compile.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @ai-girlfriend/api build
    startCommand: pnpm --filter @ai-girlfriend/api run db:migrate && pnpm --filter @ai-girlfriend/api start:prod
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: ai-girlfriend-api-config
      # --- Secret manager (sync: false). Required in production. ---
      # Supabase session pooler, port 5432 (*.pooler.supabase.com).
      # Do not use the transaction pooler on port 6543: the runtime sends
      # named prepared statements and cannot turn them off.
      - key: DATABASE_URL
        sync: false
      # Same session pooler. The start command migrates with this URL before
      # the process listens, and production boot refuses when it is empty.
      # Enable the vector extension in Supabase first.
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # SMTP URL includes the mailbox password.
      - key: SMTP_URL
        sync: false
      # Private Supabase Storage, S3 endpoint. Storage → S3 in the project.
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # --- Per-deploy settings, not credentials. Still not committed. ---
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional. Public address on /privacy and /account-deletion.
      # Until it is set, those pages show the placeholder TODO, and that
      # placeholder is not emailed. A confirmed deletion request is emailed
      # here when SMTP_URL is set.
      # Do not set value: "" — a later Blueprint sync can wipe a real address.
      - key: CONTACT_EMAIL
        sync: false
      # Optional. Developer name on the same pages. Placeholder TODO until set.
      - key: DEVELOPER_NAME
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      # --- Optional secrets. Leave the dashboard value empty to keep the
      # feature off (password-reset secret falls back, Play billing 503,
      # push 503, Firebase Auth user deletion queued, OpenAI moderation
      # unused). Do not set value: "". FIREBASE_SERVICE_ACCOUNT_JSON is also
      # the Admin key for auth.deleteUser on DELETE /users/me. Production
      # with FIREBASE_PROJECT_ID logs if that JSON is missing and still boots. ---
      - key: JWT_RESET_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: STORAGE_SIGNING_SECRET
        sync: false
      - key: GEMINI_CHAT_MODEL
        sync: false
      - key: GEMINI_IMAGE_MODEL
        sync: false
      - key: GEMINI_STT_MODEL
        sync: false
      - key: GEMINI_TTS_MODEL
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_PRODUCTS
        sync: false
      - key: MODERATION_MODEL
        sync: false
